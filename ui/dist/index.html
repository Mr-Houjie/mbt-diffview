<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbt-diffview</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #151922;
    --border: #2a2f3a;
    --text: #d8dee9;
    --muted: #9aa4b2;
    --add: #2c6b3f;
    --del: #7a2c35;
    --add-bg: #17301f;
    --del-bg: #3a1d22;
    --warn: #e5c07b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, "Cascadia Code", monospace;
  }
  .page { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }
  .hero h1 { font-size: 22px; margin: 0 0 6px; }
  .hero p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pane { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .pane-title { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .editor {
    width: 100%;
    min-height: 180px;
    padding: 10px 12px;
    border: 0;
    outline: none;
    resize: vertical;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    line-height: 1.55;
  }
  .toolbar { display: flex; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .toolbar button {
    background: #1d2430;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
  }
  .toolbar button:hover { background: #263041; }
  .stats { color: var(--muted); font-size: 12px; margin-left: auto; }
  .diff { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .row { display: grid; grid-template-columns: 48px 1fr 48px 1fr; border-bottom: 1px solid #1d222c; }
  .row:last-child { border-bottom: 0; }
  .row .no { color: #5c6370; text-align: right; padding: 3px 8px; user-select: none; border-right: 1px solid var(--border); font-size: 12px; }
  .row .old, .row .new { padding: 3px 10px; white-space: pre-wrap; word-break: break-all; font-size: 13px; line-height: 1.5; }
  .row.delete .old { background: var(--del-bg); }
  .row.insert .new { background: var(--add-bg); }
  .row.change .old { background: var(--del-bg); }
  .row.change .new { background: var(--add-bg); }
  .eq { color: inherit; }
  .del { background: var(--del); border-radius: 2px; }
  .ins { background: var(--add); border-radius: 2px; }
  .plain { color: inherit; }
  @media (max-width: 820px) {
    .editors { grid-template-columns: 1fr; }
    .row { grid-template-columns: 34px 1fr 34px 1fr; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
